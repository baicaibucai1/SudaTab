<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="SudaTab">
  <title>SudaTab</title>
  <!-- 三块面板按透视投影收向右侧（梯形靠坐标算，不是旋转），四角是圆角；
       没有字标，面板吃满画面。所有面板都由同一个 P(u,v) 生成。 -->
  <defs>
    <linearGradient id="st-bg" x1="0.05" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EDFAF1"/>
      <stop offset="0.5" stop-color="#CFEDDA"/>
      <stop offset="1" stop-color="#A6D9BA"/>
    </linearGradient>

    <radialGradient id="st-glow" cx="0.26" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 顶面：上亮下暗，模拟光从左上打过来 -->
    <linearGradient id="st-top" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#3A7A57"/>
      <stop offset="0.55" stop-color="#22543A"/>
      <stop offset="1" stop-color="#123322"/>
    </linearGradient>

    <!-- 后排两块再压一档：越远越暗，三块之间才有前后关系 -->
    <linearGradient id="st-top2" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#336E4E"/>
      <stop offset="0.55" stop-color="#1E4B34"/>
      <stop offset="1" stop-color="#0F2C1D"/>
    </linearGradient>
    <linearGradient id="st-top3" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#2C6346"/>
      <stop offset="0.55" stop-color="#1A442F"/>
      <stop offset="1" stop-color="#0C2618"/>
    </linearGradient>

    <!-- 侧面（厚度）：比顶面更深 -->
    <linearGradient id="st-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A1B"/>
      <stop offset="1" stop-color="#04120A"/>
    </linearGradient>

    <pattern id="st-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.15" fill="#2C6B49" opacity="0.18"/>
    </pattern>

    <clipPath id="st-clip">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#st-clip)">
    <rect width="128" height="128" fill="url(#st-bg)"/>
    <rect width="128" height="128" fill="url(#st-dots)"/>
    <rect width="128" height="128" fill="url(#st-glow)"/>
  </g>

  <!-- 主面板：整行，向右收 -->
  <path d="M 16.00 25.60 Q 16.00 20.80 20.46 22.59 L 107.54 57.48 Q 112.00 59.26 112.00 64.06 L 112.00 76.67 Q 112.00 81.47 107.33 80.38 L 20.67 60.17 Q 16.00 59.08 16.00 54.28 Z" fill="url(#st-side)"/>
  <path d="M 16.00 20.80 Q 16.00 16.00 20.42 17.86 L 107.58 54.62 Q 112.00 56.48 112.00 61.28 L 112.00 73.88 Q 112.00 78.68 107.35 77.50 L 20.65 55.46 Q 16.00 54.28 16.00 49.48 Z" fill="url(#st-top)"/>
  <path d="M 16.00 20.80 Q 16.00 16.00 20.42 17.86 L 107.58 54.62 Q 112.00 56.48 112.00 61.28 L 112.00 73.88 Q 112.00 78.68 107.35 77.50 L 20.65 55.46 Q 16.00 54.28 16.00 49.48 Z" fill="none" stroke="#CFF3DE" stroke-opacity="0.20" stroke-width="1"/>
  <!-- 左下：方 -->
  <path d="M 16.00 75.32 Q 16.00 70.52 20.72 71.38 L 64.08 79.33 Q 68.80 80.19 68.80 84.99 L 68.80 104.83 Q 68.80 109.63 64.00 109.55 L 20.80 108.88 Q 16.00 108.80 16.00 104.00 Z" fill="url(#st-side)"/>
  <path d="M 16.00 70.52 Q 16.00 65.72 20.70 66.68 L 64.10 75.54 Q 68.80 76.50 68.80 81.30 L 68.80 101.14 Q 68.80 105.94 64.00 105.76 L 20.80 104.18 Q 16.00 104.00 16.00 99.20 Z" fill="url(#st-top2)"/>
  <path d="M 16.00 70.52 Q 16.00 65.72 20.70 66.68 L 64.10 75.54 Q 68.80 76.50 68.80 81.30 L 68.80 101.14 Q 68.80 105.94 64.00 105.76 L 20.80 104.18 Q 16.00 104.00 16.00 99.20 Z" fill="none" stroke="#CFF3DE" stroke-opacity="0.20" stroke-width="1"/>
  <!-- 右下：窄 -->
  <path d="M 78.40 85.75 Q 78.40 81.95 82.14 82.63 L 108.26 87.42 Q 112.00 88.10 112.00 91.90 L 112.00 106.50 Q 112.00 110.30 108.20 110.24 L 82.20 109.84 Q 78.40 109.78 78.40 105.98 Z" fill="url(#st-side)"/>
  <path d="M 78.40 82.26 Q 78.40 78.46 82.12 79.22 L 108.28 84.56 Q 112.00 85.32 112.00 89.12 L 112.00 103.72 Q 112.00 107.52 108.20 107.38 L 82.20 106.43 Q 78.40 106.29 78.40 102.49 Z" fill="url(#st-top3)"/>
  <path d="M 78.40 82.26 Q 78.40 78.46 82.12 79.22 L 108.28 84.56 Q 112.00 85.32 112.00 89.12 L 112.00 103.72 Q 112.00 107.52 108.20 107.38 L 82.20 106.43 Q 78.40 106.29 78.40 102.49 Z" fill="none" stroke="#CFF3DE" stroke-opacity="0.20" stroke-width="1"/>
  <path d="M 19.84 27.87 Q 19.84 26.27 21.33 26.84 L 43.31 35.26 Q 44.80 35.84 44.80 37.44 L 44.80 38.08 Q 44.80 39.68 43.30 39.13 L 21.34 31.14 Q 19.84 30.60 19.84 29.00 Z" fill="#C8F2D9" opacity="0.5"/>
  <path d="M 19.84 37.49 Q 19.84 36.22 21.04 36.63 L 64.96 51.51 Q 65.92 51.84 65.92 52.85 L 65.92 53.23 Q 65.92 54.24 64.96 53.93 L 21.05 39.64 Q 19.84 39.25 19.84 37.98 Z" fill="#C8F2D9" opacity="0.22"/>
  <path d="M 19.84 43.55 Q 19.84 42.28 21.05 42.66 L 53.37 52.74 Q 54.40 53.06 54.40 54.13 L 54.40 54.54 Q 54.40 55.62 53.37 55.31 L 21.06 45.67 Q 19.84 45.31 19.84 44.03 Z" fill="#C8F2D9" opacity="0.16"/>

  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4"/>
</svg>
